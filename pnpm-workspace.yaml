packages:
  - '.'
allowBuilds:
  # @sentry/cli's postinstall downloads the sentry-cli binary, which the Sentry
  # Expo plugin invokes during EAS builds to upload source maps. Without it,
  # production stack traces stay minified and unreadable.
  '@sentry/cli': true
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.16'
  - '@expo/config@57.0.8'
  - '@expo/fingerprint@0.20.8'
  - '@expo/inline-modules@0.1.6'
  - '@expo/log-box@57.0.3'
  - expo-asset@57.0.12
  - expo-constants@57.0.12
  - expo@57.0.14
  - '@expo/metro-runtime@57.0.11'
  - expo-router@57.0.14
  - expo-splash-screen@57.0.7
onlyBuiltDependencies:
  - unrs-resolver
  - '@sentry/cli'
